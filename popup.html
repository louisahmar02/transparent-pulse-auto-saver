<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: Arial, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      font-size: 15px;
      color: #333;
    }
    label {
      font-size: 12px;
      color: #666;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    button {
      width: 100%;
      background-color: #6200ee;
      color: white;
      padding: 9px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    button:hover {
      background-color: #4b00c6;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #2e7d32;
      display: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>Pulse Auto-Saver Settings</h3>
  <label for="folderId">Google Drive Folder ID (string after the /folder/):</label>
  <input type="text" id="folderId" placeholder="Paste Drive Folder ID here...">
  <button id="saveBtn">Save Settings</button>
  <div id="status">✓ Settings Saved!</div>

  <script src="popup.js"></script>
</body>
</html>
